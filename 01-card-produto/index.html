<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Card de produto para loja virtual">
    <title>Card de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <article class="product-card">
            <div class="product-image-wrap">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=80" alt="Fone de ouvido sem fio">
                <span class="offer-badge">Oferta</span>
            </div>
            <div class="product-info">
                <p class="product-category">Tecnologia</p>
                <h1>Fone Wave Pro</h1>
                <p class="product-description">Som envolvente, conforto e bateria para acompanhar sua rotina.</p>
                <div class="price-row">
                    <span class="old-price">R$ 399,90</span>
                    <strong>R$ 279,90</strong>
                </div>
                <button class="buy-button" type="button">Comprar agora</button>
            </div>
        </article>
    </main>
</body>
</html>
