<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Formulário de Contato</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="contact-page">
<section class="intro"><span>FALE COM A GENTE</span><h1>Vamos conversar sobre sua próxima ideia.</h1><p>Preencha o formulário e conte um pouco sobre o que você precisa.</p></section>
<form class="contact-form" action="#" method="post">
<div class="field"><input id="name" name="name" type="text" placeholder=" " required><label for="name">Nome completo</label></div>
<div class="field"><input id="email" name="email" type="email" placeholder=" " required><label for="email">Seu melhor e-mail</label></div>
<div class="field"><select id="subject" name="subject" required><option value="" disabled selected>Escolha um assunto</option><option>Orçamento</option><option>Parceria</option><option>Suporte</option></select><label class="select-label" for="subject">Assunto</label></div>
<div class="field full"><textarea id="message" name="message" placeholder=" " required></textarea><label for="message">Mensagem</label></div>
<button class="submit full" type="submit">Enviar mensagem</button>
</form>
</main>
</body>
</html>
